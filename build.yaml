# jprm (Jellyfin Plugin Repository Manager) build manifest
name: "Episode Continuity"
guid: "3f8a1c6e-9d2b-4a7f-b5e4-c1d0e8f7a2b9"
version: "0.1.2.0"
targetAbi: "10.11.0.0"
framework: "net9.0"
owner: "gabeseltzer"
overview: "Warns viewers when the next episode to play is not the next one in the series because episodes in between are missing from the library."
description: "Detects gaps in a series (episodes the metadata provider knows about but that have no file) and warns at playback time: a warning inside the web client's 'Next episode' countdown, a pause-and-confirm interstitial before an episode that skips missing ones, and a server-sent toast for other clients."
category: "General"
artifacts:
  - "Jellyfin.Plugin.EpisodeContinuity.dll"
changelog: |
  - README documents that missing episodes come only from the TVDB plugin's "Missing Episode Fetcher", with a Requirements block and a Troubleshooting check.
  - Logs a startup warning when the library has no virtual episodes and the numbering-gaps option is off, since no gap can be detected in that state.
  - Describes the limits of the numbering-gaps fallback (same-season holes between two known episodes only).
